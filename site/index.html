<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Guppy</title>
  <style>
    :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --bg: #ffffff; --link: #0969da; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --muted: #9198a1; --bg: #0d1117; --link: #4493f8; } }
    body { margin: 0; padding: 3rem 1rem; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 36rem; margin: 0 auto; }
    h1 { margin: 0 0 .25rem; }
    p { color: var(--muted); margin: 0 0 2rem; }
    ul { padding-left: 1.25rem; }
    li { margin: .5rem 0; }
    a { color: var(--link); }
    code { font-size: .9em; }
  </style>
</head>
<body>
  <main>
    <h1>Guppy</h1>
    <p>Nilo Vélez's personal project manager.</p>
    <ul>
      <li><a href="projects.md">Projects</a> (<code>projects.md</code>): project status for humans and agents.</li>
      <li><a href="projects.json">Projects</a> (<code>projects.json</code>): the same data as JSON.</li>
      <li><a href="index.json">API entry point</a> (<code>index.json</code>): list of endpoints.</li>
      <li><a href="https://github.com/manuelstone/guppy">Source on GitHub</a>, including the <a href="https://github.com/manuelstone/guppy/blob/main/docs/status-contract.md">status contract</a>.</li>
    </ul>
  </main>
</body>
</html>
